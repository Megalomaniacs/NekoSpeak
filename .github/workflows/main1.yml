name: Build APK v1.5.0
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v1.5.0 from upstream
        uses: actions/checkout@v4
        with:
          repository: guan-tends/NekoSpeak
          ref: v1.5.0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-v1.5.0
          path: app/build/outputs/apk/debug/*.apk
