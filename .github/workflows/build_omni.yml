name: Build APK OmniVoice Fix
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/all-omnivoice-pocket

      - name: Patch files
        run: |
          sed -i 's/120000/900000/g' app/src/main/java/com/nekospeak/tts/data/ModelRepository.kt
          sed -i 's|include("armeabi-v7a", "arm64-v8a")|include("arm64-v8a")|' app/build.gradle.kts
          sed -i 's/isUniversalApk = true/isUniversalApk = false/' app/build.gradle.kts

          P=app/src/main/java/com/nekospeak/tts/engine/OmniVoiceEngine.kt
          python3 - "$P" << 'PYEOF'
          import sys
          p = sys.argv[1]
          c = open(p).read()

          c = c.replace(
            'val inputIdsTensor = OnnxTensor.createTensor(env, bIds)',
            'val inputIdsTensor = OnnxTensor.createTensor(env, java.nio.LongBuffer.wrap(bIds), longArrayOf(2L, C.toLong(), maxLen.toLong()))')

          c = c.replace(
            'val audioMaskTensor = OnnxTensor.createTensor(env, inputs.batchAudioMask)',
            'val amBytes = ByteArray(inputs.batchAudioMask.size) { if (inputs.batchAudioMask[it]) 1.toByte() else 0.toByte() }\n            val audioMaskTensor = OnnxTensor.createTensor(env, java.nio.ByteBuffer.wrap(amBytes), longArrayOf(2L, maxLen.toLong()), ai.onnxruntime.OnnxJavaType.BOOL)')

          c = c.replace(
            'val attnTensor = OnnxTensor.createTensor(env, inputs.batchAttentionMask)',
            'val atBytes = ByteArray(inputs.batchAttentionMask.size) { if (inputs.batchAttentionMask[it]) 1.toByte() else 0.toByte() }\n            val attnTensor = OnnxTensor.createTensor(env, java.nio.ByteBuffer.wrap(atBytes), longArrayOf(2L, 1L, maxLen.toLong(), maxLen.toLong()), ai.onnxruntime.OnnxJavaType.BOOL)')

          c = c.replace(
            'val codesTensor = OnnxTensor.createTensor(env, codes)',
            'val codesTensor = OnnxTensor.createTensor(env, java.nio.LongBuffer.wrap(codes), longArrayOf(1L, C.toLong(), numTargetTokens.toLong()))')

          open(p, 'w').write(c)
          print('Patched!')
          PYEOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: chmod +x gradlew

      - run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-omni-arm64
          path: app/build/outputs/apk/debug/*.apk
